---
# Example inventory for portfolio purposes.
# Replace hosts, IPs, accounts and SSH key paths before running any playbook.
all:
  children:
    linux:
      hosts:
        server1:
          ansible_host: 100.64.0.10  # Example Tailscale address, not a real target
          ansible_user: admin
          ansible_port: 22
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    kvm_hosts:
      hosts:
        hypervisor-01:
          ansible_host: 192.0.2.20  # RFC 5737 documentation address
          ansible_user: admin
          ansible_port: 22
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    k3s_master:
      hosts:
        k8s-master-01:
          ansible_host: 192.0.2.31
          ansible_user: admin
          ansible_port: 22
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: '-o ProxyJump=admin@192.0.2.20'

    k3s_workers:
      hosts:
        k8s-worker-01:
          ansible_host: 192.0.2.32
          ansible_user: admin
          ansible_port: 22
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: '-o ProxyJump=admin@192.0.2.20'

        k8s-worker-02:
          ansible_host: 192.0.2.33
          ansible_user: admin
          ansible_port: 22
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: '-o ProxyJump=admin@192.0.2.20'

    k3s_cluster:
      children:
        k3s_master:
        k3s_workers:
