---
kvm_storage_pool_name: k8s-lab
kvm_storage_pool_path: /var/lib/libvirt/images/k8s-lab

kvm_base_image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
kvm_base_image_name: ubuntu-22.04-server-cloudimg-amd64.img

kvm_default_user: admin

kvm_vms:
  - name: k8s-master-01
    vcpu: 2
    memory_mb: 3072
    disk_gb: 25

  - name: k8s-worker-01
    vcpu: 2
    memory_mb: 3072
    disk_gb: 25

  - name: k8s-worker-02
    vcpu: 2
    memory_mb: 3072
    disk_gb: 25
