---
- name: Install Zsh, Oh My Zsh and plugins
  hosts: linux
  become: true
  gather_facts: true

  tasks:
    - name: Install zsh and git
      ansible.builtin.apt:
        name:
          - zsh
          - git
        state: present
        update_cache: true

    - name: Check if Oh My Zsh is already installed
      ansible.builtin.stat:
        path: "{{ zsh_home }}/.oh-my-zsh"
      register: oh_my_zsh_dir

    - name: Clone Oh My Zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ zsh_home }}/.oh-my-zsh"
        version: master
        depth: 1
      become: true
      become_user: "{{ zsh_user }}"
      when: not oh_my_zsh_dir.stat.exists

    - name: Ensure custom plugins directory exists
      ansible.builtin.file:
        path: "{{ zsh_plugins_dir }}"
        state: directory
        owner: "{{ zsh_user }}"
        group: "{{ zsh_user }}"
        mode: "0755"

    - name: Install zsh-autosuggestions plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ zsh_plugins_dir }}/zsh-autosuggestions"
        version: master
        depth: 1
      become: true
      become_user: "{{ zsh_user }}"

    - name: Install zsh-syntax-highlighting plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ zsh_plugins_dir }}/zsh-syntax-highlighting"
        version: master
        depth: 1
      become: true
      become_user: "{{ zsh_user }}"

    - name: Get zsh path
      ansible.builtin.command: which zsh
      register: zsh_path
      changed_when: false

    - name: Show zsh path
      ansible.builtin.debug:
        msg: "Zsh installed at {{ zsh_path.stdout }}"

    - name: Show current login shell
      ansible.builtin.command: getent passwd "{{ zsh_user }}"
      register: user_passwd_entry
      changed_when: false

    - name: Print current user shell
      ansible.builtin.debug:
        msg: "{{ user_passwd_entry.stdout }}"
