---
- name: Install Tailscale
  hosts: linux
  become: true
  gather_facts: true

  tasks:
    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Tailscale GPG key
      ansible.builtin.get_url:
        url: >-
          https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"

    - name: Add Tailscale APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} main
        filename: tailscale
        state: present
        update_cache: true

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: "{{ tailscale_package }}"
        state: present
        update_cache: true

    - name: Ensure tailscaled service is enabled and running
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Verify Tailscale version
      ansible.builtin.command: tailscale version
      register: tailscale_version
      changed_when: false

    - name: Show Tailscale version
      ansible.builtin.debug:
        msg: "{{ tailscale_version.stdout_lines }}"
