---
- name: Create server info file from template
  hosts: linux
  become: true
  gather_facts: true

  tasks:
    - name: Create server info file
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/server-info.txt.j2"
        dest: /etc/server-info.txt
        owner: root
        group: root
        mode: "0644"
