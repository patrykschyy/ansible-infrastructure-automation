---
- name: Harden SSH configuration
  hosts: linux
  become: true
  gather_facts: false

  vars:
    ssh_hardening_file: /etc/ssh/sshd_config.d/99-hardening.conf
    ssh_allowed_user: "{{ ansible_user }}"

  tasks:
    - name: Ensure sshd_config.d directory exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check if SSH hardening file exists
      ansible.builtin.stat:
        path: "{{ ssh_hardening_file }}"
      register: ssh_hardening_stat

    - name: Backup existing SSH hardening file
      ansible.builtin.copy:
        src: "{{ ssh_hardening_file }}"
        dest: "{{ ssh_hardening_file }}.bak"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: ssh_hardening_stat.stat.exists

    - name: Deploy SSH hardening configuration
      ansible.builtin.copy:
        dest: "{{ ssh_hardening_file }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible
          # SSH hardening for Tailscale-only administration

          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no

          PermitRootLogin no
          PermitEmptyPasswords no

          X11Forwarding no
          AllowTcpForwarding no
          AllowAgentForwarding no

          ClientAliveInterval 300
          ClientAliveCountMax 2

          MaxAuthTries 3
          MaxSessions 3

          LoginGraceTime 30
          UseDNS no

          AllowUsers {{ ssh_allowed_user }}
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH

    - name: Validate SSH configuration
      ansible.builtin.command: sshd -t
      register: sshd_config_test
      changed_when: false

    - name: Show SSH hardening status
      ansible.builtin.debug:
        msg: "SSH hardening applied. Root SSH and password SSH login are disabled. User {{ ssh_allowed_user }} can still log in by SSH key."

  handlers:
    - name: Reload SSH
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
